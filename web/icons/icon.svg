<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21385a"/><stop offset="1" stop-color="#0c1622"/></linearGradient><linearGradient id="sail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4a07a"/><stop offset="1" stop-color="#c95f3b"/></linearGradient><linearGradient id="jib" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf7ec"/><stop offset="1" stop-color="#e3d4ba"/></linearGradient><linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8efe0"/><stop offset="1" stop-color="#d6c3a3"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f0946c" stop-opacity=".45"/><stop offset="1" stop-color="#f0946c" stop-opacity="0"/></radialGradient>
<clipPath id="tile"><path d="M128 16 H384 A112 112 0 0 1 496 128 V384 A112 112 0 0 1 384 496 H128 A112 112 0 0 1 16 384 V128 A112 112 0 0 1 128 16 Z"/></clipPath></defs>
<path d="M128 16 H384 A112 112 0 0 1 496 128 V384 A112 112 0 0 1 384 496 H128 A112 112 0 0 1 16 384 V128 A112 112 0 0 1 128 16 Z" fill="url(#sky)"/>
<g clip-path="url(#tile)">
  <circle cx="330" cy="190" r="190" fill="url(#glow)"/>
  <!-- water: two bands of waves and a shimmer under the hull -->
  <path d="M170 418 H342 M206 429 H306" stroke="#f8efe0" stroke-opacity=".28" stroke-width="6" stroke-linecap="round"/>
  <path d="M-24 440 q40 -18 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" fill="none" stroke="#5a8fbb" stroke-width="14" stroke-linecap="round"/>
  <path d="M-24 474 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" fill="none" stroke="#5a8fbb" stroke-width="10" stroke-linecap="round" opacity=".45" transform="translate(40 0)"/>
</g>
<!-- rigging: mast with a pennant, boom -->
<rect x="250" y="62" width="8" height="270" rx="3" fill="#eadcc3"/>
<path d="M258 64 L304 78 L258 92 Z" fill="#c95f3b"/>
<!-- main sail, its leech bellied by the wind, with panel seams -->
<path d="M246 90 Q150 196 104 314 L246 314 Z" fill="url(#sail)"/>
<path d="M246 158 L168 168 M246 218 L136 230 M246 274 L116 284" stroke="#000" stroke-opacity=".12" stroke-width="3"/>
<rect x="98" y="316" width="166" height="10" rx="5" fill="#eadcc3"/>
<!-- jib -->
<path d="M264 128 Q354 210 392 316 L264 316 Z" fill="url(#jib)"/>
<path d="M264 196 L330 204 M264 258 L362 266" stroke="#000" stroke-opacity=".08" stroke-width="3"/>
<!-- hull with a sheer stripe and a shaded underside -->
<path d="M76 340 H436 L394 398 Q256 422 118 398 Z" fill="url(#hull)"/>
<path d="M84 352 H428 L421 362 H92 Z" fill="#c95f3b"/>
<path d="M76 340 H436" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
<path d="M128 16 H384 A112 112 0 0 1 496 128 V384 A112 112 0 0 1 384 496 H128 A112 112 0 0 1 16 384 V128 A112 112 0 0 1 128 16 Z" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="4"/>
</svg>